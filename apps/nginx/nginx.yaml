apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: parcial-aonhl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: parcial-aonhl
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-route
  namespace: parcial-aonhl
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`nginx.anderson.lab`)
      services:
        - name: nginx-svc
          port: 80
