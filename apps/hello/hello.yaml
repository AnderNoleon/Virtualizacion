apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: parcial-aonhl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: parcial-aonhl
spec:
  selector:
    app: hello
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-route
  namespace: parcial-aonhl
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`hello.anderson.lab`)
      services:
        - name: hello-svc
          port: 80
