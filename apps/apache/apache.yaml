apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: parcial-aonhl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: httpd:2.4
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-svc
  namespace: parcial-aonhl
spec:
  selector:
    app: apache
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apache-route
  namespace: parcial-aonhl
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`apache.anderson.lab`)
      services:
        - name: apache-svc
          port: 80
