# Chart: prometheus-community/prometheus
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true          # estado de pods (kube_pod_status_phase)
prometheus-node-exporter:
  enabled: true          # CPU y memoria del nodo
server:
  baseURL: "http://prometheus.anderson.lab"
  retention: "7d"
  persistentVolume:
    enabled: true
    size: 5Gi
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
