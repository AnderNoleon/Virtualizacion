apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-aonhl
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-cluster-metrics
    files:
      - cluster-metrics.json
  - name: dashboard-parcial-logs
    files:
      - parcial-logs.json
