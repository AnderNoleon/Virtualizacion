# Chart: grafana/promtail (se despliega como DaemonSet)
config:
  clients:
    - url: http://loki.monitoring-aonhl.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      # Conservar solo los logs de las apps del parcial y de Traefik
      # Se usa la etiqueta meta para no depender del orden de los relabel del chart
      - source_labels: [__meta_kubernetes_namespace]
        regex: "parcial-aonhl|traefik"
        action: keep
