# SOLO si el repositorio es PRIVADO.
# Copiar a repo-secret.yaml (está en .gitignore), poner el token y aplicar:
#   kubectl apply -f argocd/repo-secret.yaml
# NUNCA subir el token al repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: repo-github
  namespace: argocd-aonhl
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/AnderNoleon/Virtualizacion.git
  username: AnderNoleon
  password: GITHUB_PERSONAL_ACCESS_TOKEN
